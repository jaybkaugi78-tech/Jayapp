<!DOCTYPE html>
<html lang="en">
<head>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jay & Millie 💜</title>
<style>
  :root {
    --purple-light: #EEEDFE;
    --purple-mid: #AFA9EC;
    --purple-dark: #3C3489;
    --pink-light: #FBEAF0;
    --pink-mid: #ED93B1;
    --pink-dark: #72243E;
    --bg: #f8f7fc;
    --card: #ffffff;
    --border: #e8e5f0;
    --text: #1a1a2e;
    --muted: #7a7a9a;
    --success: #1D9E75;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

  /* LOGIN */
  #login-screen {
    min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1rem;
  }
  .login-card {
    background: var(--card); border-radius: 20px; padding: 2.5rem 2rem; width: 100%; max-width: 360px;
    border: 1px solid var(--border); text-align: center;
  }
  .login-avatars { display: flex; justify-content: center; margin-bottom: 1.25rem; }
  .login-av { width: 52px; height: 52px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 600; border: 3px solid var(--bg); }
  .login-av-j { background: var(--purple-light); color: var(--purple-dark); }
  .login-av-m { background: var(--pink-light); color: var(--pink-dark); margin-left: -14px; }
  .login-title { font-size: 20px; font-weight: 600; margin-bottom: 4px; }
  .login-sub { font-size: 13px; color: var(--muted); margin-bottom: 1.5rem; }
  .login-btns { display: flex; flex-direction: column; gap: 10px; margin-bottom: 1.25rem; }
  .login-btn { padding: 12px; border-radius: 12px; border: 1.5px solid var(--border); font-size: 15px; font-weight: 500; cursor: pointer; transition: opacity 0.15s; }
  .login-btn:hover { opacity: 0.8; }
  .login-btn-j { background: var(--purple-light); color: var(--purple-dark); border-color: var(--purple-mid); }
  .login-btn-m { background: var(--pink-light); color: var(--pink-dark); border-color: var(--pink-mid); }
  .pin-row { display: none; flex-direction: column; gap: 8px; }
  .pin-row.show { display: flex; }
  .pin-row input { padding: 10px 14px; border-radius: 10px; border: 1.5px solid var(--border); font-size: 15px; text-align: center; letter-spacing: 4px; outline: none; }
  .pin-row input:focus { border-color: var(--purple-mid); }
  .pin-confirm { padding: 10px; border-radius: 10px; border: none; font-size: 14px; font-weight: 500; cursor: pointer; }
  .pin-confirm-j { background: var(--purple-dark); color: #fff; }
  .pin-confirm-m { background: var(--pink-dark); color: #fff; }
  .pin-error { font-size: 12px; color: #E24B4A; display: none; }

  /* APP */
  #app { display: none; max-width: 480px; margin: 0 auto; padding: 0 0 80px; }
  .app-header {
    background: var(--card); border-bottom: 1px solid var(--border); padding: 14px 16px;
    display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 10;
  }
  .header-left { display: flex; align-items: center; gap: 10px; }
  .h-avatars { display: flex; }
  .h-av { width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; border: 2px solid var(--card); }
  .h-av-j { background: var(--purple-light); color: var(--purple-dark); }
  .h-av-m { background: var(--pink-light); color: var(--pink-dark); margin-left: -8px; }
  .h-title { font-size: 15px; font-weight: 600; }
  .h-sub { font-size: 11px; color: var(--muted); }
  .logout-btn { background: none; border: 1px solid var(--border); border-radius: 8px; padding: 5px 10px; font-size: 12px; color: var(--muted); cursor: pointer; }
  .logout-btn:hover { background: var(--bg); }

  .tabs-bar {
    display: flex; background: var(--card); border-bottom: 1px solid var(--border);
    position: sticky; top: 63px; z-index: 9;
  }
  .tab-btn { flex: 1; padding: 12px 4px; font-size: 13px; font-weight: 500; border: none; background: none; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; }
  .tab-btn.active { color: var(--text); border-bottom-color: var(--purple-dark); }

  .tab-content { display: none; padding: 16px; }
  .tab-content.active { display: block; }

  /* CHAT */
  .chat-msgs { display: flex; flex-direction: column; gap: 12px; margin-bottom: 16px; min-height: 200px; }
  .msg-row { display: flex; gap: 8px; align-items: flex-end; }
  .msg-row.me { flex-direction: row-reverse; }
  .msg-av-sm { width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600; flex-shrink: 0; }
  .bubble { max-width: 72%; padding: 10px 14px; border-radius: 18px; font-size: 14px; line-height: 1.5; }
  .bubble-j { background: var(--purple-light); color: var(--purple-dark); border-bottom-right-radius: 4px; }
  .bubble-m { background: var(--pink-light); color: var(--pink-dark); border-bottom-left-radius: 4px; }
  .msg-meta { font-size: 10px; color: var(--muted); margin-top: 3px; }
  .msg-row.me .msg-meta { text-align: right; }
  .chat-input-area { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 10px 12px; }
  .chat-input-area textarea { width: 100%; border: none; outline: none; font-size: 14px; resize: none; font-family: inherit; background: transparent; color: var(--text); }
  .chat-input-footer { display: flex; align-items: center; justify-content: space-between; margin-top: 8px; }
  .typing-as { font-size: 12px; color: var(--muted); }
  .typing-as span { font-weight: 600; }
  .chat-send { padding: 7px 18px; border-radius: 20px; border: none; font-size: 13px; font-weight: 600; cursor: pointer; }
  .chat-send-j { background: var(--purple-dark); color: #fff; }
  .chat-send-m { background: var(--pink-dark); color: #fff; }
  .empty-state { text-align: center; padding: 2rem 0; color: var(--muted); font-size: 13px; }

  /* REMINDERS */
  .rem-card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 12px 14px; margin-bottom: 10px; display: flex; gap: 12px; align-items: flex-start; }
  .rem-icon { width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 17px; flex-shrink: 0; }
  .rem-j { background: var(--purple-light); }
  .rem-m { background: var(--pink-light); }
  .rem-body { flex: 1; }
  .rem-text { font-size: 14px; line-height: 1.5; }
  .rem-meta { font-size: 11px; color: var(--muted); margin-top: 3px; }
  .rem-del { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 18px; padding: 0 4px; }
  .rem-del:hover { color: #E24B4A; }
  .add-box { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 14px; }
  .add-box textarea { width: 100%; border: none; outline: none; font-size: 14px; resize: none; font-family: inherit; color: var(--text); background: transparent; }
  .add-box-footer { display: flex; gap: 8px; align-items: center; margin-top: 10px; border-top: 1px solid var(--border); padding-top: 10px; }
  .add-box-footer select { flex: 1; padding: 7px 10px; border-radius: 10px; border: 1px solid var(--border); font-size: 13px; background: var(--bg); color: var(--text); outline: none; }
  .add-box-btn { padding: 7px 18px; border-radius: 10px; border: none; font-size: 13px; font-weight: 600; background: var(--purple-dark); color: #fff; cursor: pointer; }

  /* CALENDAR */
  .cal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .cal-nav-btn { width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--border); background: var(--card); cursor: pointer; font-size: 15px; display: flex; align-items: center; justify-content: center; color: var(--muted); }
  .cal-nav-btn:hover { background: var(--bg); }
  .cal-month-label { font-size: 15px; font-weight: 600; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 12px; margin-bottom: 16px; }
  .cal-day-name { text-align: center; font-size: 11px; color: var(--muted); padding: 4px 0; font-weight: 500; }
  .cal-day { text-align: center; font-size: 13px; padding: 7px 2px; border-radius: 8px; cursor: pointer; position: relative; }
  .cal-day:hover { background: var(--bg); }
  .cal-day.today { background: var(--purple-light); color: var(--purple-dark); font-weight: 600; }
  .cal-day.selected { background: var(--purple-dark); color: #fff; font-weight: 600; }
  .cal-day.selected.today { background: var(--purple-dark); }
  .cal-day.has-event::after { content: ''; width: 4px; height: 4px; border-radius: 50%; background: var(--pink-dark); position: absolute; bottom: 2px; left: 50%; transform: translateX(-50%); }
  .cal-day.other-month { color: #ccc; cursor: default; }
  .cal-day.other-month:hover { background: none; }
  .cal-events-title { font-size: 13px; font-weight: 600; color: var(--muted); margin-bottom: 10px; }
  .ev-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px; margin-bottom: 8px; display: flex; align-items: flex-start; gap: 10px; }
  .ev-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; margin-top: 5px; }
  .ev-dot-j { background: var(--purple-dark); }
  .ev-dot-m { background: var(--pink-dark); }
  .ev-text { flex: 1; font-size: 14px; }
  .ev-who { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .ev-del { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 16px; }
  .ev-del:hover { color: #E24B4A; }
  .add-ev-row { display: flex; gap: 8px; margin-top: 10px; }
  .add-ev-row input { flex: 1; padding: 9px 12px; border-radius: 10px; border: 1px solid var(--border); font-size: 13px; outline: none; background: var(--card); color: var(--text); }
  .add-ev-row input:focus { border-color: var(--purple-mid); }
  .add-ev-row select { padding: 0 10px; border-radius: 10px; border: 1px solid var(--border); font-size: 13px; outline: none; background: var(--card); color: var(--text); }
  .add-ev-row button { padding: 9px 16px; border-radius: 10px; border: none; background: var(--purple-dark); color: #fff; font-size: 13px; font-weight: 600; cursor: pointer; }

  .loading { text-align: center; padding: 2rem; color: var(--muted); font-size: 13px; }
  .online-badge { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--success); }
  .online-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--success); }

  @media (max-width: 480px) {
    .tab-btn { font-size: 12px; padding: 10px 2px; }
  }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-card">
    <div class="login-avatars">
      <div class="login-av login-av-j">J</div>
      <div class="login-av login-av-m">M</div>
    </div>
    <div class="login-title">Jay & Millie 💜</div>
    <div class="login-sub">our private little space</div>
    <button id="install-btn" style="display:none;">Install App</button>
    <div class="login-btns">
      <button class="login-btn login-btn-j" onclick="selectUser('Jay')">I'm Jay</button>
      <button class="login-btn login-btn-m" onclick="selectUser('Millie')">I'm Millie</button>
    </div>
    <div class="pin-row" id="pin-row">
      <input type="password" id="pin-input" maxlength="4" placeholder="Enter PIN" inputmode="numeric">
      <button class="pin-confirm" id="pin-confirm-btn" onclick="confirmPin()">Enter</button>
      <div class="pin-error" id="pin-error">Wrong PIN, try again 🙈</div>
    </div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <div class="app-header">
    <div class="header-left">
      <div class="h-avatars">
        <div class="h-av h-av-j">J</div>
        <div class="h-av h-av-m">M</div>
      </div>
      <div>
        <div class="h-title">Jay & Millie 💜</div>
        <div class="h-sub" id="logged-in-as">logged in as —</div>
      </div>
    </div>
    <button class="logout-btn" onclick="logout()">Leave</button>
  </div>

  <div class="tabs-bar">
    <button class="tab-btn active" onclick="switchTab('chat', this)">💬 Messages</button>
    <button class="tab-btn" onclick="switchTab('reminders', this)">🔔 Reminders</button>
    <button class="tab-btn" onclick="switchTab('calendar', this)">📅 Planner</button>
  </div>

  <!-- CHAT -->
  <div id="tab-chat" class="tab-content active">
    <div class="chat-msgs" id="chat-msgs">
      <div class="loading">Loading messages...</div>
    </div>
    <div class="chat-input-area">
      <textarea id="chat-input" rows="2" placeholder="Type something..."></textarea>
      <div class="chat-input-footer">
        <div class="typing-as">Sending as <span id="typing-as-name">—</span></div>
     <input type="file" id="media-input" accept="image/*,video/*" style="display:none">
     <button class="chat-send" onclick="document.getElementById('media-input').click()">📎</button>
        <button class="chat-send" id="chat-send-btn" onclick="sendMessage()">Send</button>
      </div>
    </div>
  </div>

  <!-- REMINDERS -->
  <div id="tab-reminders" class="tab-content">
    <div id="rem-list"><div class="loading">Loading reminders...</div></div>
    <div class="add-box">
      <textarea id="rem-input" rows="2" placeholder="Leave a reminder or sweet note..."></textarea>
      <div class="add-box-footer">
        <select id="rem-from-sel">
          <option value="Jay">From Jay</option>
          <option value="Millie">From Millie</option>
        </select>
        <button class="add-box-btn" onclick="addReminder()">+ Add</button>
      </div>
    </div>
  </div>

  <!-- CALENDAR -->
  <div id="tab-calendar" class="tab-content">
    <div class="cal-header">
      <button class="cal-nav-btn" onclick="changeMonth(-1)">&#8249;</button>
      <div class="cal-month-label" id="cal-label"></div>
      <button class="cal-nav-btn" onclick="changeMonth(1)">&#8250;</button>
    </div>
    <div class="cal-grid" id="cal-grid"></div>
    <div class="cal-events-title" id="cal-events-title">Plans</div>
    <div id="events-list"></div>
    <div class="add-ev-row">
      <input type="text" id="ev-input" placeholder="Add a plan...">
      <select id="ev-who-sel">
        <option value="Jay">Jay</option>
        <option value="Millie">Millie</option>
      </select>
      <button onclick="addEvent()">+ Add</button>
    </div>
  </div>
</div> 

<!-- Firebase -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc, query, orderBy, serverTimestamp, setDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
  import { getMessaging, getToken } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-messaging.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDig5IqgBD1vj8godQYd5bzMErESkePCwI",
  authDomain: "jay-and-millie.firebaseapp.com",
  projectId: "jay-and-millie",
  storageBucket: "jay-and-millie.firebasestorage.app",
  messagingSenderId: "458162909286",
  appId: "1:458162909286:web:90814571d8c82e8f93fda7",
  measurementId: "G-0565NWVG2T"
    };
  // ==============================

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const messaging = getMessaging(app);
  let currentUser = null;
  let calDate = new Date();
  let selectedDay = new Date();
  const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  const DAYS = ['S','M','T','W','T','F','S'];

  function dateKey(d) { return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); }
  function fmtTime(ts) {
    if (!ts) return '';
    const d = ts.toDate ? ts.toDate() : new Date(ts);
    return d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
  }
  function fmtDateShort(ts) {
    if (!ts) return '';
    const d = ts.toDate ? ts.toDate() : new Date(ts);
    return d.toLocaleDateString([], {month:'short', day:'numeric'});
  }

  window.selectUser = function(user) {
    currentUser = user;
    const pinRow = document.getElementById('pin-row');
    const confirmBtn = document.getElementById('pin-confirm-btn');
    pinRow.classList.add('show');
    confirmBtn.className = 'pin-confirm pin-confirm-' + (user === 'Jay' ? 'j' : 'm');
    document.getElementById('pin-input').focus();
    document.getElementById('pin-error').style.display = 'none';
  };

  window.confirmPin = async function() {
  const entered = document.getElementById('pin-input').value;
  const res = await fetch('/api/verify-pin', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ user: currentUser, pin: entered })
  });
  const data = await res.json();
  if (data.success) {
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    document.getElementById('logged-in-as').textContent = 'logged in as ' + currentUser;
    document.getElementById('typing-as-name').textContent = currentUser;
    const sendBtn = document.getElementById('chat-send-btn');
    sendBtn.className = 'chat-send chat-send-' + (currentUser === 'Jay' ? 'j' : 'm');
    document.getElementById('rem-from-sel').value = currentUser;
    document.getElementById('ev-who-sel').value = currentUser;
    setupNotifications();
    startListeners();
    renderCal();
  } else {
    document.getElementById('pin-error').style.display = 'block';
    document.getElementById('pin-input').value = '';
  }
  async function setupNotifications() {
  try {
    const permission = await Notification.requestPermission();
    if (permission !== 'granted') return;
    const registration = await navigator.serviceWorker.ready;
    const token = await getToken(messaging, {
      vapidKey: 'BOU94obBxIxszMHiFOulYexORLu7-aVb8N-V-HqbXLlNJR-cP_nR0U9MkAw-LS0z2Em8DbhfEZrS9UP-DkJda90',
      serviceWorkerRegistration: registration
    });
    if (token) {
      await setDoc(doc(db, 'tokens', currentUser), { token, updatedAt: serverTimestamp() });
    }
  } catch (err) {
    console.error('Notification setup failed:', err);
  }
}
};

  window.logout = function() {
    currentUser = null;
    document.getElementById('login-screen').style.display = 'flex';
    document.getElementById('app').style.display = 'none';
    document.getElementById('pin-input').value = '';
    document.getElementById('pin-row').classList.remove('show');
  };

  window.switchTab = function(name, btn) {
    document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.getElementById('tab-' + name).classList.add('active');
    btn.classList.add('active');
    if (name === 'calendar') renderCal();
  };

  function startListeners() {
    // Messages
    const msgsQ = query(collection(db, 'messages'), orderBy('timestamp', 'asc'));
    onSnapshot(msgsQ, snap => {
      const box = document.getElementById('chat-msgs');
      if (snap.empty) {
        box.innerHTML = '<div class="empty-state">No messages yet — say something! 💜</div>';
        return;
      }
      box.innerHTML = snap.docs.map(d => {
        const m = d.data();
        const isMe = m.from === currentUser;
        const bubbleCls = m.from === 'Jay' ? 'bubble bubble-j' : 'bubble bubble-m';
        const avCls = m.from === 'Jay' ? 'msg-av-sm h-av-j' : 'msg-av-sm h-av-m';
        return `<div class="msg-row ${isMe ? 'me' : ''}">
          <div class="${avCls}" style="width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;flex-shrink:0;">${m.from[0]}</div>
          <div>
<div class="${bubbleCls}">
  ${m.mediaUrl
    ? m.mediaType === 'video'
      ? `<video src="${m.mediaUrl}" controls style="max-width:200px;border-radius:8px;"></video>`
      : `<img src="${m.mediaUrl}" style="max-width:200px;border-radius:8px;">`
    : m.text}
</div>
            <div class="msg-meta">${m.from} · ${fmtTime(m.timestamp)}</div>
          </div>
        </div>`;
      }).join('');
      setTimeout(() => { box.scrollTop = box.scrollHeight; }, 100);
    });

    // Reminders
    const remsQ = query(collection(db, 'reminders'), orderBy('timestamp', 'desc'));
    onSnapshot(remsQ, snap => {
      const list = document.getElementById('rem-list');
      if (snap.empty) {
        list.innerHTML = '<div class="empty-state">No reminders yet 🔔</div>';
        return;
      }
      list.innerHTML = snap.docs.map(d => {
        const r = d.data();
        const iconCls = r.from === 'Jay' ? 'rem-icon rem-j' : 'rem-icon rem-m';
        const emoji = r.from === 'Jay' ? '💜' : '🌸';
        return `<div class="rem-card">
          <div class="${iconCls}">${emoji}</div>
          <div class="rem-body">
            <div class="rem-text">${r.text}</div>
            <div class="rem-meta">From ${r.from} · ${fmtDateShort(r.timestamp)}</div>
          </div>
          <button class="rem-del" onclick="deleteReminder('${d.id}')">×</button>
        </div>`;
      }).join('');
    });

    // Events
    onSnapshot(collection(db, 'events'), snap => {
      window._events = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      renderCal();
      renderEvents();
    });
  }

  window.sendMessage = async function() {
  const input = document.getElementById('chat-input');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  await addDoc(collection(db, 'messages'), { from: currentUser, text, timestamp: serverTimestamp() });
  const other = currentUser === 'Jay' ? 'Millie' : 'Jay';
  await fetch('/api/notify', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ to: other, from: currentUser, message: text })
  });
};

   window.sendMedia = async function(file) {
  if (!file || !currentUser) return;
  
  const formData = new FormData();
  formData.append('file', file);
  formData.append('upload_preset', 'jaykaugi');
  
  const res = await fetch('https://api.cloudinary.com/v1_1/dpw1ypxiv/auto/upload', {
    method: 'POST',
    body: formData
  });
  const data = await res.json();
  const mediaType = file.type.startsWith('video') ? 'video' : 'image';
  
  await addDoc(collection(db, 'messages'), {
    from: currentUser,
    text: '',
    mediaUrl: data.secure_url,
    mediaType: mediaType,
    timestamp: serverTimestamp()
  });
};

document.getElementById('media-input').addEventListener('change', (e) => {
  if (e.target.files[0]) sendMedia(e.target.files[0]);
});
  window.addReminder = async function() {
    const text = document.getElementById('rem-input').value.trim();
    const from = document.getElementById('rem-from-sel').value;
    if (!text) return;
    document.getElementById('rem-input').value = '';
    await addDoc(collection(db, 'reminders'), { from, text, timestamp: serverTimestamp() });
  };

  window.deleteReminder = async function(id) {
    await deleteDoc(doc(db, 'reminders', id));
  };

  window.addEvent = async function() {
    const text = document.getElementById('ev-input').value.trim();
    const from = document.getElementById('ev-who-sel').value;
    if (!text) return;
    document.getElementById('ev-input').value = '';
    await addDoc(collection(db, 'events'), { text, from, date: dateKey(selectedDay) });
    renderEvents();
  };

  window.deleteEvent = async function(id) {
    await deleteDoc(doc(db, 'events', id));
  };

  window.changeMonth = function(d) {
    calDate = new Date(calDate.getFullYear(), calDate.getMonth() + d, 1);
    renderCal();
  };

  window.selectDay = function(y, m, d) {
    selectedDay = new Date(y, m, d);
    renderCal();
    renderEvents();
  };

  function renderCal() {
    document.getElementById('cal-label').textContent = MONTHS[calDate.getMonth()] + ' ' + calDate.getFullYear();
    const today = new Date();
    const y = calDate.getFullYear(), mo = calDate.getMonth();
    const first = new Date(y, mo, 1).getDay();
    const daysInMonth = new Date(y, mo + 1, 0).getDate();
    const prevDays = new Date(y, mo, 0).getDate();
    const events = window._events || [];

    let html = DAYS.map(d => `<div class="cal-day-name">${d}</div>`).join('');
    for (let i = 0; i < first; i++) {
      html += `<div class="cal-day other-month">${prevDays - first + 1 + i}</div>`;
    }
    for (let d = 1; d <= daysInMonth; d++) {
      const k = y + '-' + (mo + 1) + '-' + d;
      const isToday = today.getFullYear()===y && today.getMonth()===mo && today.getDate()===d;
      const isSel = selectedDay.getFullYear()===y && selectedDay.getMonth()===mo && selectedDay.getDate()===d;
      const hasEv = events.some(e => e.date === k);
      const cls = ['cal-day', isToday?'today':'', isSel?'selected':'', hasEv?'has-event':''].filter(Boolean).join(' ');
      html += `<div class="${cls}" onclick="selectDay(${y},${mo},${d})">${d}</div>`;
    }
    document.getElementById('cal-grid').innerHTML = html;
    renderEvents();
  }

  function renderEvents() {
    const events = window._events || [];
    const k = dateKey(selectedDay);
    const label = selectedDay.toLocaleDateString([], {weekday:'long', month:'long', day:'numeric'});
    document.getElementById('cal-events-title').textContent = 'Plans for ' + label;
    const evs = events.filter(e => e.date === k);
    const list = document.getElementById('events-list');
    if (!evs.length) {
      list.innerHTML = '<div class="empty-state" style="padding:1rem 0;font-size:13px;color:var(--muted);">Nothing planned yet — add something!</div>';
      return;
    }
    list.innerHTML = evs.map(e => `<div class="ev-card">
      <div class="ev-dot ${e.from==='Jay'?'ev-dot-j':'ev-dot-m'}"></div>
      <div style="flex:1"><div class="ev-text">${e.text}</div><div class="ev-who">by ${e.from}</div></div>
      <button class="ev-del" onclick="deleteEvent('${e.id}')">×</button>
    </div>`).join('');
  }

  window._events = [];

  // Enter to send
  document.getElementById('chat-input').addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); window.sendMessage(); }
  });
  document.getElementById('pin-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') window.confirmPin();
  });
</script>

window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  document.getElementById('install-btn').style.display = 'inline-block';
});

document.getElementById('install-btn').addEventListener('click', async () => {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  await deferredPrompt.userChoice;
  deferredPrompt = null;
  document.getElementById('install-btn').style.display = 'none';
});
