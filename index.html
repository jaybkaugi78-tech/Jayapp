<!DOCTYPE html>
<html lang="en">
<head>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#08040d">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jay & Millie</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #05030a;
    --bg-soft: #0a0610;
    --card: #10081b;
    --card-raised: #170d26;
    --card-muted: #0d0714;
    --control: #1a1028;
    --border: rgba(218, 190, 255, 0.16);
    --border-strong: rgba(194, 138, 255, 0.42);
    --text: #f7f0ff;
    --muted: #aa9abe;
    --muted-strong: #7e708d;
    --purple-light: #24123c;
    --purple-mid: #8d5cff;
    --purple-dark: #d5b8ff;
    --pink-light: #2b101f;
    --pink-mid: #ff7db6;
    --pink-dark: #ffb1d5;
    --success: #62d394;
    --danger: #ff6f8e;
    --shadow: 0 22px 70px rgba(0, 0, 0, 0.42);
    --soft-shadow: 0 14px 36px rgba(0, 0, 0, 0.22);
    --radius: 8px;
    --radius-sm: 6px;
  }

  body.light {
    color-scheme: light;
    --bg: #f7f2ff;
    --bg-soft: #efe7fb;
    --card: #ffffff;
    --card-raised: #fbf8ff;
    --card-muted: #f2eafc;
    --control: #f1e8fc;
    --border: rgba(73, 41, 119, 0.14);
    --border-strong: rgba(95, 44, 170, 0.34);
    --text: #17101f;
    --muted: #695d78;
    --muted-strong: #8c7d9b;
    --purple-light: #eee3ff;
    --purple-mid: #6e35cb;
    --purple-dark: #4f2499;
    --pink-light: #ffeaf4;
    --pink-mid: #c74380;
    --pink-dark: #8a2450;
    --shadow: 0 22px 70px rgba(40, 17, 73, 0.16);
    --soft-shadow: 0 12px 30px rgba(40, 17, 73, 0.1);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html { min-height: 100%; background: var(--bg); }

  body {
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background:
      linear-gradient(145deg, #05030a 0%, #12071d 48%, #05030a 100%);
    color: var(--text);
    min-height: 100vh;
    position: relative;
  }

  body.light {
    background:
      linear-gradient(145deg, #f8f3ff 0%, #efe6fb 48%, #ffffff 100%);
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background-image:
      linear-gradient(rgba(255, 255, 255, 0.028) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255, 255, 255, 0.022) 1px, transparent 1px);
    background-size: 42px 42px;
    mask-image: linear-gradient(to bottom, rgba(0, 0, 0, 0.85), transparent 72%);
  }

  body.light::before {
    background-image:
      linear-gradient(rgba(73, 41, 119, 0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(73, 41, 119, 0.04) 1px, transparent 1px);
  }

  button,
  input,
  textarea,
  select {
    font: inherit;
  }

  button {
    cursor: pointer;
  }

  button:focus-visible,
  input:focus-visible,
  textarea:focus-visible,
  select:focus-visible {
    outline: 2px solid var(--purple-mid);
    outline-offset: 2px;
  }

  /* LOGIN */
  #login-screen {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .login-card {
    position: relative;
    width: 100%;
    max-width: 380px;
    overflow: hidden;
    background: linear-gradient(180deg, var(--card-raised), var(--card));
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 34px 28px 28px;
    text-align: center;
    box-shadow: var(--shadow);
  }

  .login-card::before {
    content: "";
    position: absolute;
    inset: 0 0 auto;
    height: 2px;
    background: linear-gradient(90deg, var(--purple-mid), var(--pink-mid));
  }

  .login-avatars {
    display: flex;
    justify-content: center;
    margin-bottom: 18px;
  }

  .login-av {
    width: 54px;
    height: 54px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    font-weight: 700;
    border: 3px solid var(--card);
    box-shadow: var(--soft-shadow);
  }

  .login-av-j { background: var(--purple-light); color: var(--purple-dark); }
  .login-av-m { background: var(--pink-light); color: var(--pink-dark); margin-left: -14px; }
  .login-title { font-size: 24px; font-weight: 750; line-height: 1.1; margin-bottom: 8px; }
  .login-sub { font-size: 13px; color: var(--muted); margin-bottom: 24px; }

  #install-btn {
    display: none;
    width: 100%;
    margin-bottom: 12px;
    padding: 11px 14px;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    background: var(--control);
    color: var(--text);
    font-weight: 650;
  }

  .login-btns {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 18px;
  }

  .login-btn {
    width: 100%;
    min-height: 46px;
    padding: 12px 14px;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    color: var(--text);
    font-size: 15px;
    font-weight: 700;
    transition: border-color 0.18s, transform 0.18s, background 0.18s;
  }

  .login-btn:hover {
    transform: translateY(-1px);
    border-color: var(--border-strong);
  }

  .login-btn-j {
    background: linear-gradient(180deg, rgba(141, 92, 255, 0.24), rgba(83, 42, 148, 0.18));
  }

  .login-btn-m {
    background: linear-gradient(180deg, rgba(255, 125, 182, 0.2), rgba(137, 42, 89, 0.14));
  }

  .pin-row {
    display: none;
    flex-direction: column;
    gap: 9px;
  }

  .pin-row.show { display: flex; }

  .pin-row input {
    width: 100%;
    padding: 12px 14px;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    background: var(--card-muted);
    color: var(--text);
    font-size: 15px;
    text-align: center;
  }

  .pin-row input:focus {
    border-color: var(--border-strong);
  }

  .pin-confirm {
    min-height: 42px;
    padding: 10px;
    border-radius: var(--radius);
    border: none;
    color: #100817;
    font-size: 14px;
    font-weight: 750;
    transition: transform 0.18s, filter 0.18s;
  }

  .pin-confirm:hover { transform: translateY(-1px); filter: brightness(1.04); }
  .pin-confirm-j { background: linear-gradient(135deg, var(--purple-dark), var(--purple-mid)); }
  .pin-confirm-m { background: linear-gradient(135deg, var(--pink-dark), var(--pink-mid)); }
  .pin-error { font-size: 12px; color: var(--danger); display: none; }

  /* APP */
  #app {
    display: none;
    width: min(100%, 560px);
    min-height: 100vh;
    margin: 0 auto;
    padding: 0 0 84px;
    background: rgba(7, 4, 12, 0.78);
    border-left: 1px solid var(--border);
    border-right: 1px solid var(--border);
    box-shadow: var(--shadow);
  }

  body.light #app { background: rgba(255, 255, 255, 0.68); }

  .app-header {
    background: rgba(12, 7, 20, 0.9);
    border-bottom: 1px solid var(--border);
    padding: 14px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    position: sticky;
    top: 0;
    z-index: 10;
    backdrop-filter: blur(18px);
  }

  body.light .app-header { background: rgba(255, 255, 255, 0.88); }
  .header-left { display: flex; align-items: center; gap: 11px; min-width: 0; }
  .header-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .h-avatars { display: flex; }
  .h-av {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 750;
    border: 2px solid var(--card);
  }

  .h-av-j { background: var(--purple-light); color: var(--purple-dark); }
  .h-av-m { background: var(--pink-light); color: var(--pink-dark); margin-left: -8px; }
  .h-title { font-size: 15px; font-weight: 760; }
  .h-sub { font-size: 11px; color: var(--muted); }

  .logout-btn {
    min-height: 34px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 7px 10px;
    background: var(--control);
    color: var(--muted);
    font-size: 12px;
    font-weight: 700;
    transition: color 0.18s, border-color 0.18s, background 0.18s;
  }

  .logout-btn:hover {
    color: var(--text);
    border-color: var(--border-strong);
    background: var(--card-raised);
  }

  .tabs-bar {
    display: flex;
    gap: 6px;
    background: rgba(12, 7, 20, 0.9);
    border-bottom: 1px solid var(--border);
    padding: 8px 10px;
    position: sticky;
    top: 63px;
    z-index: 9;
    backdrop-filter: blur(18px);
  }

  body.light .tabs-bar { background: rgba(255, 255, 255, 0.86); }

  .tab-btn {
    flex: 1;
    min-height: 36px;
    padding: 8px 6px;
    border-radius: var(--radius);
    border: 1px solid transparent;
    background: transparent;
    color: var(--muted);
    font-size: 13px;
    font-weight: 750;
    transition: color 0.18s, border-color 0.18s, background 0.18s;
  }

  .tab-btn:hover {
    color: var(--text);
    background: var(--control);
  }

  .tab-btn.active {
    color: var(--text);
    border-color: var(--border);
    background: linear-gradient(180deg, rgba(141, 92, 255, 0.18), rgba(255, 125, 182, 0.08));
  }

  .tab-content { display: none; padding: 18px 16px; }
  .tab-content.active { display: block; }

  /* CHAT */
  .load-older {
    display: none;
    text-align: center;
    padding: 0 0 14px;
  }

  .load-older button {
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 8px 14px;
    background: var(--control);
    color: var(--muted);
    font-size: 13px;
    font-weight: 700;
  }

  .chat-msgs {
    display: flex;
    flex-direction: column-reverse;
    gap: 13px;
    margin-bottom: 16px;
    min-height: 300px;
  }

  .msg-row { display: flex; gap: 9px; align-items: flex-end; }
  .msg-row.me { flex-direction: row-reverse; }

  .msg-av-sm {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 750;
    flex-shrink: 0;
  }

  .msg-content { max-width: min(76%, 380px); }

  .bubble {
    width: fit-content;
    max-width: 100%;
    padding: 10px 13px;
    border-radius: 14px;
    border: 1px solid var(--border);
    color: var(--text);
    font-size: 14px;
    line-height: 1.5;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.14);
    overflow-wrap: anywhere;
  }

  .bubble-j {
    margin-left: auto;
    background: linear-gradient(180deg, rgba(141, 92, 255, 0.26), rgba(73, 36, 134, 0.32));
    border-color: rgba(181, 134, 255, 0.22);
    border-bottom-right-radius: 5px;
  }

  .bubble-m {
    background: linear-gradient(180deg, rgba(255, 125, 182, 0.2), rgba(120, 38, 84, 0.24));
    border-color: rgba(255, 145, 195, 0.2);
    border-bottom-left-radius: 5px;
  }

  .msg-meta {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 10px;
    color: var(--muted-strong);
    margin-top: 4px;
  }

  .msg-row.me .msg-meta { text-align: right; }
  .msg-row.me .msg-meta { justify-content: flex-end; }

  .msg-delete {
    border: none;
    background: transparent;
    color: var(--muted-strong);
    font-size: 13px;
    line-height: 1;
    padding: 0 3px;
  }

  .msg-delete:hover { color: var(--danger); }

  .media-preview {
    display: block;
    width: min(230px, 100%);
    max-height: 260px;
    border-radius: var(--radius);
    object-fit: cover;
  }

  .chat-input-area {
    background: linear-gradient(180deg, var(--card-raised), var(--card));
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px;
    box-shadow: var(--soft-shadow);
  }

  .chat-input-area textarea {
    width: 100%;
    min-height: 52px;
    border: none;
    outline: none;
    color: var(--text);
    background: transparent;
    font-size: 14px;
    resize: none;
  }

  .chat-input-area textarea::placeholder,
  .add-box textarea::placeholder,
  .add-ev-row input::placeholder,
  .pin-row input::placeholder {
    color: var(--muted-strong);
  }

  .chat-input-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid var(--border);
  }

  .typing-as { font-size: 12px; color: var(--muted); }
  .typing-as span { font-weight: 750; color: var(--text); }
  .chat-actions { display: flex; align-items: center; gap: 8px; }

  .chat-send {
    min-height: 36px;
    padding: 8px 16px;
    border-radius: var(--radius);
    border: 1px solid transparent;
    color: #100817;
    font-size: 13px;
    font-weight: 800;
    transition: transform 0.18s, filter 0.18s;
  }

  .chat-send:hover { transform: translateY(-1px); filter: brightness(1.04); }
  .chat-send-j { background: linear-gradient(135deg, var(--purple-dark), var(--purple-mid)); }
  .chat-send-m { background: linear-gradient(135deg, var(--pink-dark), var(--pink-mid)); }

  .attach-btn {
    width: 36px;
    padding: 0;
    background: var(--control);
    color: var(--text);
    border-color: var(--border);
  }

  .empty-state {
    text-align: center;
    padding: 34px 16px;
    color: var(--muted);
    font-size: 13px;
  }

  .empty-state.compact { padding: 16px 0; }

  /* REMINDERS */
  .rem-card {
    background: linear-gradient(180deg, var(--card-raised), var(--card));
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 13px 14px;
    margin-bottom: 10px;
    display: flex;
    gap: 12px;
    align-items: flex-start;
    box-shadow: var(--soft-shadow);
  }

  .rem-icon {
    width: 36px;
    height: 36px;
    border-radius: var(--radius);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
    font-weight: 800;
    flex-shrink: 0;
  }

  .rem-j { background: var(--purple-light); }
  .rem-m { background: var(--pink-light); }
  .rem-body { flex: 1; }
  .rem-text { font-size: 14px; line-height: 1.5; }
  .rem-meta { font-size: 11px; color: var(--muted); margin-top: 4px; }

  .rem-del {
    width: 28px;
    height: 28px;
    border: 1px solid transparent;
    border-radius: var(--radius-sm);
    background: transparent;
    color: var(--muted);
    font-size: 18px;
    line-height: 1;
  }

  .rem-del:hover {
    color: var(--danger);
    border-color: var(--border);
    background: var(--control);
  }

  .add-box {
    background: linear-gradient(180deg, var(--card-raised), var(--card));
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px;
    box-shadow: var(--soft-shadow);
  }

  .add-box textarea {
    width: 100%;
    min-height: 54px;
    border: none;
    outline: none;
    color: var(--text);
    background: transparent;
    font-size: 14px;
    resize: none;
  }

  .add-box-footer {
    display: flex;
    gap: 8px;
    align-items: center;
    margin-top: 10px;
    border-top: 1px solid var(--border);
    padding-top: 10px;
  }

  .add-box-footer select {
    flex: 1;
    min-width: 0;
    padding: 8px 10px;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    background: var(--control);
    color: var(--text);
    font-size: 13px;
    outline: none;
  }

  .add-box-btn {
    min-height: 36px;
    padding: 8px 16px;
    border-radius: var(--radius);
    border: none;
    background: linear-gradient(135deg, var(--purple-dark), var(--purple-mid));
    color: #100817;
    font-size: 13px;
    font-weight: 800;
  }

  /* CALENDAR */
  .cal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
  }

  .cal-nav-btn {
    width: 34px;
    height: 34px;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    background: var(--control);
    color: var(--muted);
    font-size: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .cal-nav-btn:hover {
    color: var(--text);
    border-color: var(--border-strong);
    background: var(--card-raised);
  }

  .cal-month-label { font-size: 15px; font-weight: 800; }

  .cal-grid {
    display: grid;
    grid-template-columns: repeat(7, minmax(0, 1fr));
    gap: 4px;
    background: linear-gradient(180deg, var(--card-raised), var(--card));
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px;
    margin-bottom: 16px;
    box-shadow: var(--soft-shadow);
  }

  .cal-day-name {
    text-align: center;
    font-size: 11px;
    color: var(--muted);
    padding: 4px 0 7px;
    font-weight: 750;
  }

  .cal-day {
    min-height: 34px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    font-size: 13px;
    border-radius: var(--radius-sm);
    cursor: pointer;
    position: relative;
  }

  .cal-day:hover { background: var(--control); }
  .cal-day.today { color: var(--purple-dark); font-weight: 800; background: var(--purple-light); }
  .cal-day.selected { background: linear-gradient(135deg, var(--purple-dark), var(--purple-mid)); color: #120819; font-weight: 850; }
  .cal-day.selected.today { background: linear-gradient(135deg, var(--purple-dark), var(--purple-mid)); }

  .cal-day.has-event::after {
    content: "";
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: var(--pink-dark);
    position: absolute;
    bottom: 5px;
    left: 50%;
    transform: translateX(-50%);
  }

  .cal-day.other-month { color: var(--muted-strong); cursor: default; opacity: 0.42; }
  .cal-day.other-month:hover { background: none; }

  .cal-events-title { font-size: 13px; font-weight: 800; color: var(--muted); margin-bottom: 10px; }

  .ev-card {
    background: linear-gradient(180deg, var(--card-raised), var(--card));
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 11px 12px;
    margin-bottom: 8px;
    display: flex;
    align-items: flex-start;
    gap: 10px;
  }

  .ev-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; margin-top: 5px; }
  .ev-dot-j { background: var(--purple-dark); }
  .ev-dot-m { background: var(--pink-dark); }
  .ev-body { flex: 1; min-width: 0; }
  .ev-text { flex: 1; font-size: 14px; }
  .ev-who { font-size: 11px; color: var(--muted); margin-top: 3px; }

  .ev-del {
    width: 28px;
    height: 28px;
    border: 1px solid transparent;
    border-radius: var(--radius-sm);
    background: transparent;
    color: var(--muted);
    font-size: 16px;
  }

  .ev-del:hover {
    color: var(--danger);
    border-color: var(--border);
    background: var(--control);
  }

  .add-ev-row {
    display: grid;
    grid-template-columns: 1fr auto auto;
    gap: 8px;
    margin-top: 10px;
  }

  .add-ev-row input,
  .add-ev-row select {
    min-width: 0;
    padding: 9px 11px;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    background: var(--control);
    color: var(--text);
    font-size: 13px;
    outline: none;
  }

  .add-ev-row input:focus,
  .add-ev-row select:focus,
  .add-box-footer select:focus {
    border-color: var(--border-strong);
  }

  .add-ev-row button {
    min-height: 38px;
    padding: 9px 15px;
    border-radius: var(--radius);
    border: none;
    background: linear-gradient(135deg, var(--purple-dark), var(--purple-mid));
    color: #100817;
    font-size: 13px;
    font-weight: 800;
  }

  .loading { text-align: center; padding: 34px 16px; color: var(--muted); font-size: 13px; }
  .online-badge { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--success); }
  .online-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--success); }

  @media (max-width: 480px) {
    #app { border: none; }
    .app-header { padding: 12px 14px; }
    .tabs-bar { top: 59px; }
    .tab-content { padding: 16px 14px; }
    .tab-btn { font-size: 12px; padding: 8px 2px; }
    .add-ev-row { grid-template-columns: 1fr; }
    .add-ev-row select,
    .add-ev-row button { width: 100%; min-height: 38px; }
  }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-card">
    <div class="login-avatars">
      <div class="login-av login-av-j">J</div>
      <div class="login-av login-av-m">M</div>
    </div>
    <div class="login-title">Jay & Millie</div>
    <div class="login-sub">Private space for two</div>
    <button id="install-btn">Install app</button>
    <div class="login-btns">
      <button class="login-btn login-btn-j" onclick="selectUser('Jay')">Continue as Jay</button>
      <button class="login-btn login-btn-m" onclick="selectUser('Millie')">Continue as Millie</button>
    </div>
    <div class="pin-row" id="pin-row">
      <input type="password" id="pin-input" maxlength="4" placeholder="Enter PIN" inputmode="numeric">
      <button class="pin-confirm" id="pin-confirm-btn" onclick="confirmPin()">Enter</button>
      <div class="pin-error" id="pin-error">Wrong PIN. Try again.</div>
    </div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <div class="app-header">
    <div class="header-left">
      <div class="h-avatars">
        <div class="h-av h-av-j">J</div>
        <div class="h-av h-av-m">M</div>
      </div>
      <div>
        <div class="h-title">Jay & Millie</div>
        <div class="h-sub" id="logged-in-as">signed in</div>
      </div>
    </div>
    <div class="header-actions">
      <button id="theme-btn" class="logout-btn" onclick="toggleTheme()">Light</button>
      <button class="logout-btn" onclick="logout()">Leave</button>
    </div>
  </div>

  <div class="tabs-bar">
    <button class="tab-btn active" onclick="switchTab('chat', this)">Messages</button>
    <button class="tab-btn" onclick="switchTab('reminders', this)">Reminders</button>
    <button class="tab-btn" onclick="switchTab('calendar', this)">Planner</button>
  </div>

  <!-- CHAT -->
  <div id="tab-chat" class="tab-content active">
  <div id="load-older-btn" class="load-older">
    <button onclick="loadOlderMessages()">Load older messages</button>
  </div>
  <div class="chat-msgs" id="chat-msgs">
    <div class="loading">Loading messages...</div>
  </div>
    <div class="chat-input-area">
      <textarea id="chat-input" rows="2" placeholder="Write a message..."></textarea>
      <div class="chat-input-footer">
        <div class="typing-as">Sending as <span id="typing-as-name">-</span></div>
        <div class="chat-actions">
          <input type="file" id="media-input" accept="image/*,video/*" style="display:none">
          <button class="chat-send attach-btn" title="Attach media" aria-label="Attach media" onclick="document.getElementById('media-input').click()">+</button>
          <button class="chat-send" id="chat-send-btn" onclick="sendMessage()">Send</button>
        </div>
      </div>
    </div>
  </div>

  <!-- REMINDERS -->
  <div id="tab-reminders" class="tab-content">
    <div id="rem-list"><div class="loading">Loading reminders...</div></div>
    <div class="add-box">
      <textarea id="rem-input" rows="2" placeholder="Leave a reminder or sweet note..."></textarea>
      <div class="add-box-footer">
        <select id="rem-from-sel">
          <option value="Jay">From Jay</option>
          <option value="Millie">From Millie</option>
        </select>
        <button class="add-box-btn" onclick="addReminder()">Add</button>
      </div>
    </div>
  </div>

  <!-- CALENDAR -->
  <div id="tab-calendar" class="tab-content">
    <div class="cal-header">
      <button class="cal-nav-btn" onclick="changeMonth(-1)">&#8249;</button>
      <div class="cal-month-label" id="cal-label"></div>
      <button class="cal-nav-btn" onclick="changeMonth(1)">&#8250;</button>
    </div>
    <div class="cal-grid" id="cal-grid"></div>
    <div class="cal-events-title" id="cal-events-title">Plans</div>
    <div id="events-list"></div>
    <div class="add-ev-row">
      <input type="text" id="ev-input" placeholder="Add a plan...">
      <select id="ev-who-sel">
        <option value="Jay">Jay</option>
        <option value="Millie">Millie</option>
      </select>
      <button onclick="addEvent()">Add</button>
    </div>
  </div>
</div> 

<!-- Firebase -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc, query, orderBy, serverTimestamp, setDoc, limitToLast, getDocs, limit, endBefore } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
  import { getMessaging, getToken } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-messaging.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDig5IqgBD1vj8godQYd5bzMErESkePCwI",
  authDomain: "jay-and-millie.firebaseapp.com",
  projectId: "jay-and-millie",
  storageBucket: "jay-and-millie.firebasestorage.app",
  messagingSenderId: "458162909286",
  appId: "1:458162909286:web:90814571d8c82e8f93fda7",
  measurementId: "G-0565NWVG2T"
    };
  // ==============================

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const messaging = getMessaging(app);
  let currentUser = null;
  let calDate = new Date();
  let selectedDay = new Date();
  const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  const DAYS = ['S','M','T','W','T','F','S'];

  function dateKey(d) { return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); }
  function fmtTime(ts) {
    if (!ts) return '';
    const d = ts.toDate ? ts.toDate() : new Date(ts);
    return d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
  }
  function fmtDateShort(ts) {
    if (!ts) return '';
    const d = ts.toDate ? ts.toDate() : new Date(ts);
    return d.toLocaleDateString([], {month:'short', day:'numeric'});
  }

  window.selectUser = function(user) {
    currentUser = user;
    const pinRow = document.getElementById('pin-row');
    const confirmBtn = document.getElementById('pin-confirm-btn');
    pinRow.classList.add('show');
    confirmBtn.className = 'pin-confirm pin-confirm-' + (user === 'Jay' ? 'j' : 'm');
    document.getElementById('pin-input').focus();
    document.getElementById('pin-error').style.display = 'none';
  };

  window.confirmPin = async function() {
  const entered = document.getElementById('pin-input').value;
  const res = await fetch('/api/verify-pin', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ user: currentUser, pin: entered })
  });
  const data = await res.json();
  if (data.success) {
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    document.getElementById('logged-in-as').textContent = 'signed in as ' + currentUser;
    document.getElementById('typing-as-name').textContent = currentUser;
    const sendBtn = document.getElementById('chat-send-btn');
    sendBtn.className = 'chat-send chat-send-' + (currentUser === 'Jay' ? 'j' : 'm');
    document.getElementById('rem-from-sel').value = currentUser;
    document.getElementById('ev-who-sel').value = currentUser;
    setupNotifications();
    startListeners();
    renderCal();
  } else {
    document.getElementById('pin-error').style.display = 'block';
    document.getElementById('pin-input').value = '';
  }
  async function setupNotifications() {
  try {
    const permission = await Notification.requestPermission();
    if (permission !== 'granted') return;
    const registration = await navigator.serviceWorker.ready;
    const token = await getToken(messaging, {
      vapidKey: 'BOU94obBxIxszMHiFOulYexORLu7-aVb8N-V-HqbXLlNJR-cP_nR0U9MkAw-LS0z2Em8DbhfEZrS9UP-DkJda90',
      serviceWorkerRegistration: registration
    });
    if (token) {
      await setDoc(doc(db, 'tokens', currentUser), { token, updatedAt: serverTimestamp() });
    }
  } catch (err) {
    console.error('Notification setup failed:', err);
  }
}
};

  window.logout = function() {
    currentUser = null;
    document.getElementById('login-screen').style.display = 'flex';
    document.getElementById('app').style.display = 'none';
    document.getElementById('pin-input').value = '';
    document.getElementById('pin-row').classList.remove('show');
  };

  window.switchTab = function(name, btn) {
    document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.getElementById('tab-' + name).classList.add('active');
    btn.classList.add('active');
    if (name === 'calendar') renderCal();
  };

let oldestDoc = null;
let allMessages = [];
function startListeners() {
  // Messages
const msgsQ = query(collection(db, 'messages'), orderBy('timestamp', 'asc'), limitToLast(50));
onSnapshot(msgsQ, snap => {
  const box = document.getElementById('chat-msgs');
  if (snap.empty) {
    box.innerHTML = '<div class="empty-state">No messages yet. Say something.</div>';
    return;
  }
  if (!oldestDoc) {
    oldestDoc = snap.docs[0];
    document.getElementById('load-older-btn').style.display = 'block';
  }
  allMessages = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  renderMessages(allMessages);
});
};

window.loadOlderMessages = async function() {
  if (!oldestDoc) return;
  const olderQ = query(collection(db, 'messages'), orderBy('timestamp', 'asc'), endBefore(oldestDoc), limitToLast(50));
  const snap = await getDocs(olderQ);
  if (snap.empty) {
    document.getElementById('load-older-btn').style.display = 'none';
    return;
  }
  oldestDoc = snap.docs[0];
  const olderMessages = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  allMessages = [...olderMessages, ...allMessages];
  const box = document.getElementById('chat-msgs');
  const prevHeight = box.scrollHeight;
  renderMessages(allMessages);
  box.scrollTop = box.scrollHeight - prevHeight;
  if (snap.docs.length < 50) document.getElementById('load-older-btn').style.display = 'none';
};

function renderMessages(messages) {
  const box = document.getElementById('chat-msgs');
  box.innerHTML = [...messages].reverse().map(m => {
    const isMe = m.from === currentUser;
    const bubbleCls = m.from === 'Jay' ? 'bubble bubble-j' : 'bubble bubble-m';
    const avCls = m.from === 'Jay' ? 'msg-av-sm h-av-j' : 'msg-av-sm h-av-m';
    return `<div class="msg-row ${isMe ? 'me' : ''}">
      <div class="${avCls}">${m.from === 'Jay' ? 'J' : 'M'}</div>
      <div class="msg-content">
        <div class="${bubbleCls}">
          ${m.mediaUrl ? m.mediaType === 'video'
            ? `<video class="media-preview" src="${m.mediaUrl}" controls></video>`
            : `<img class="media-preview" src="${m.mediaUrl}" alt="">`
            : m.text}
        </div>
        <div class="msg-meta">
          ${m.from} &middot; ${fmtTime(m.timestamp)}
          ${isMe ? `<button class="msg-delete" onclick="deleteMessage('${m.id}')" title="Delete message" aria-label="Delete message">&times;</button>` : ''}
        </div>
      </div>
    </div>`;
  }).join('');
}

window.deleteMessage = async function(id) {
  if (!confirm('Delete this message?')) return;
  await deleteDoc(doc(db, 'messages', id));
};


    // Reminders
    const remsQ = query(collection(db, 'reminders'), orderBy('timestamp', 'desc'));
    onSnapshot(remsQ, snap => {
      const list = document.getElementById('rem-list');
      if (snap.empty) {
        list.innerHTML = '<div class="empty-state">No reminders yet.</div>';
        return;
      }
      list.innerHTML = snap.docs.map(d => {
        const r = d.data();
        const iconCls = r.from === 'Jay' ? 'rem-icon rem-j' : 'rem-icon rem-m';
        const avatar = r.from === 'Jay' ? 'J' : 'M';
        return `<div class="rem-card">
          <div class="${iconCls}">${avatar}</div>
          <div class="rem-body">
            <div class="rem-text">${r.text}</div>
            <div class="rem-meta">From ${r.from} &middot; ${fmtDateShort(r.timestamp)}</div>
          </div>
          <button class="rem-del" onclick="deleteReminder('${d.id}')" aria-label="Delete reminder">&times;</button>
        </div>`;
      }).join('');
    });

    // Events
    onSnapshot(collection(db, 'events'), snap => {
      window._events = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      renderCal();
      renderEvents();
    });
  

  window.sendMessage = async function() {
  const input = document.getElementById('chat-input');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  await addDoc(collection(db, 'messages'), { from: currentUser, text, timestamp: serverTimestamp() });
  const other = currentUser === 'Jay' ? 'Millie' : 'Jay';
  try {
  const res = await fetch('/api/notify', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ to: other, from: currentUser, message: text })
  });
  if (!res.ok) console.error('Notify failed:', res.status);
} catch (err) {
  console.error('Notify error:', err);
};
};

   window.sendMedia = async function(file) {
  if (!file || !currentUser) return;
  
  const formData = new FormData();
  formData.append('file', file);
  formData.append('upload_preset', 'jaykaugi');
  
  const res = await fetch('https://api.cloudinary.com/v1_1/dpw1ypxiv/auto/upload', {
    method: 'POST',
    body: formData
  });
  const data = await res.json();
  const mediaType = file.type.startsWith('video') ? 'video' : 'image';
  
  await addDoc(collection(db, 'messages'), {
    from: currentUser,
    text: '',
    mediaUrl: data.secure_url,
    mediaType: mediaType,
    timestamp: serverTimestamp()
  });
};

document.getElementById('media-input').addEventListener('change', (e) => {
  if (e.target.files[0]) sendMedia(e.target.files[0]);
});
  window.addReminder = async function() {
    const text = document.getElementById('rem-input').value.trim();
    const from = document.getElementById('rem-from-sel').value;
    if (!text) return;
    document.getElementById('rem-input').value = '';
    await addDoc(collection(db, 'reminders'), { from, text, timestamp: serverTimestamp() });
  };

  window.deleteReminder = async function(id) {
    await deleteDoc(doc(db, 'reminders', id));
  };

  window.addEvent = async function() {
    const text = document.getElementById('ev-input').value.trim();
    const from = document.getElementById('ev-who-sel').value;
    if (!text) return;
    document.getElementById('ev-input').value = '';
    await addDoc(collection(db, 'events'), { text, from, date: dateKey(selectedDay) });
    renderEvents();
  };

  window.deleteEvent = async function(id) {
    await deleteDoc(doc(db, 'events', id));
  };

  window.changeMonth = function(d) {
    calDate = new Date(calDate.getFullYear(), calDate.getMonth() + d, 1);
    renderCal();
  };

  window.selectDay = function(y, m, d) {
    selectedDay = new Date(y, m, d);
    renderCal();
    renderEvents();
  };

  function renderCal() {
    document.getElementById('cal-label').textContent = MONTHS[calDate.getMonth()] + ' ' + calDate.getFullYear();
    const today = new Date();
    const y = calDate.getFullYear(), mo = calDate.getMonth();
    const first = new Date(y, mo, 1).getDay();
    const daysInMonth = new Date(y, mo + 1, 0).getDate();
    const prevDays = new Date(y, mo, 0).getDate();
    const events = window._events || [];

    let html = DAYS.map(d => `<div class="cal-day-name">${d}</div>`).join('');
    for (let i = 0; i < first; i++) {
      html += `<div class="cal-day other-month">${prevDays - first + 1 + i}</div>`;
    }
    for (let d = 1; d <= daysInMonth; d++) {
      const k = y + '-' + (mo + 1) + '-' + d;
      const isToday = today.getFullYear()===y && today.getMonth()===mo && today.getDate()===d;
      const isSel = selectedDay.getFullYear()===y && selectedDay.getMonth()===mo && selectedDay.getDate()===d;
      const hasEv = events.some(e => e.date === k);
      const cls = ['cal-day', isToday?'today':'', isSel?'selected':'', hasEv?'has-event':''].filter(Boolean).join(' ');
      html += `<div class="${cls}" onclick="selectDay(${y},${mo},${d})">${d}</div>`;
    }
    document.getElementById('cal-grid').innerHTML = html;
    renderEvents();
  }
  window.toggleTheme = function() {
  const isLight = document.body.classList.toggle('light');
  localStorage.setItem('theme', isLight ? 'light' : 'dark');
  updateThemeButton();
}

function updateThemeButton() {
  const themeBtn = document.getElementById('theme-btn');
  if (!themeBtn) return;
  themeBtn.textContent = document.body.classList.contains('light') ? 'Dark' : 'Light';
}

// Load saved theme on startup.
const savedTheme = localStorage.getItem('theme');
if (savedTheme === 'light') {
  document.body.classList.add('light');
}
updateThemeButton();

  function renderEvents() {
    const events = window._events || [];
    const k = dateKey(selectedDay);
    const label = selectedDay.toLocaleDateString([], {weekday:'long', month:'long', day:'numeric'});
    document.getElementById('cal-events-title').textContent = 'Plans for ' + label;
    const evs = events.filter(e => e.date === k);
    const list = document.getElementById('events-list');
    if (!evs.length) {
      list.innerHTML = '<div class="empty-state compact">Nothing planned yet. Add something.</div>';
      return;
    }
    list.innerHTML = evs.map(e => `<div class="ev-card">
      <div class="ev-dot ${e.from==='Jay'?'ev-dot-j':'ev-dot-m'}"></div>
      <div class="ev-body"><div class="ev-text">${e.text}</div><div class="ev-who">by ${e.from}</div></div>
      <button class="ev-del" onclick="deleteEvent('${e.id}')" aria-label="Delete event">&times;</button>
    </div>`).join('');
  }

  window._events = [];

  // Enter to send
  document.getElementById('chat-input').addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); window.sendMessage(); }
  });
  document.getElementById('pin-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') window.confirmPin();
  });
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js');
  });
}

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js');
  });
}

let deferredPrompt;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  document.getElementById('install-btn').style.display = 'inline-block';
});

document.getElementById('install-btn').addEventListener('click', async () => {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  await deferredPrompt.userChoice;
  deferredPrompt = null;
  document.getElementById('install-btn').style.display = 'none';
});
</script>
</body>
</html>
